name: render-site

# Renders every covered course into a static demo site and deploys it to
# GitHub Pages, so each row on the sweep board has a Preview to open.
# Runs nightly after the day's sweeps, or on demand.

on:
  workflow_dispatch:
  schedule:
    - cron: '25 11 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: render-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render all covered courses
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python caddie/render_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
